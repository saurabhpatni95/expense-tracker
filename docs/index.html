<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker Pro++</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{background:#f8fafc}
        .card{border-radius:1rem}
        .progress{height:6px}
        .toggle-btn.active{background:#0d6efd;color:#fff}
    </style>
</head>

<body>
<div class="container py-3">

    <!-- HEADER -->
    <div class="card mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h6>Monthly Balance</h6>
                <h2 id="balance">₹0</h2>
                <small id="incomeText"></small>
            </div>
            <div class="btn-group">
                <button class="btn btn-outline-primary toggle-btn active" id="viewFamily">Family</button>
                <button class="btn btn-outline-primary toggle-btn" id="viewPersonal">Personal</button>
            </div>
        </div>
        <div class="px-3 pb-2 d-flex gap-3">
            <span class="badge bg-primary" id="husbandSummary">Husband ₹0</span>
            <span class="badge bg-success" id="wifeSummary">Wife ₹0</span>
        </div>
    </div>

    <!-- MONTH TABS -->
    <ul class="nav nav-pills mb-3" id="monthTabs"></ul>

    <!-- ADD CATEGORY -->
    <div class="card mb-3">
        <div class="card-body row g-2">
            <div class="col-md-4"><input id="newCategory" class="form-control" placeholder="Category"></div>
            <div class="col-md-4"><input id="newSubCategory" class="form-control" placeholder="Sub-category"></div>
            <div class="col-md-2"><input id="catBudget" type="number" class="form-control" placeholder="Monthly Budget"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100" id="addCatBtn">Add</button></div>
        </div>
    </div>

    <!-- CATEGORY BUDGET VIEW -->
    <div class="card mb-3">
        <div class="card-body">
            <h6>Category Budgets</h6>
            <div id="catManager"></div>
        </div>
    </div>

    <!-- ADD EXPENSE -->
    <div class="card mb-3">
        <div class="card-body row g-2">
            <div class="col-md-2">
                <select id="person" class="form-select">
                    <option>Husband</option>
                    <option>Wife</option>
                    <option>Family</option>
                </select>
            </div>
            <div class="col-md-2"><select id="category" class="form-select"></select></div>
            <div class="col-md-2"><select id="subCategory" class="form-select"></select></div>
            <div class="col-md-2"><input id="amount" type="number" class="form-control" placeholder="Amount"></div>
            <div class="col-md-2">
                <select id="recurring" class="form-select">
                    <option value="">One-time</option>
                    <option value="monthly">Recurring</option>
                </select>
            </div>
            <div class="col-md-2"><button class="btn btn-success w-100" id="addExpenseBtn">Add</button></div>
        </div>
    </div>

    <!-- YEARLY SUMMARY -->
    <div class="card mb-3">
        <div class="card-body">
            <h6>Yearly Category Summary</h6>
            <canvas id="yearChart"></canvas>
        </div>
    </div>

    <!-- EXPENSE LIST -->
    <div class="card">
        <ul class="list-group list-group-flush" id="list"></ul>
    </div>

</div>

<script>
    'use strict';

    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const $=id=>document.getElementById(id);
    const YEAR=new Date().getFullYear();

    let store=JSON.parse(localStorage.getItem('tracker_pro_pp'))||{
      year:YEAR,
      month:new Date().getMonth(),
      view:'Family',
      data:{},
      recurring:[]
    };

    if(!store.data[YEAR]) store.data[YEAR]={months:{},categories:{}};
    months.forEach((_,i)=>{if(!store.data[YEAR].months[i])store.data[YEAR].months[i]=[]});

    const categoryEl=$('category');
    const subCategoryEl=$('subCategory');
    let chart=null;

    /* Month Tabs */
    $('monthTabs').innerHTML=months.map((m,i)=>`
    <li class="nav-item">
    <button class="nav-link ${i===store.month?'active':''}" data-i="${i}">${m}</button>
    </li>`).join('');

    $('monthTabs').onclick=e=>{
      if(e.target.dataset.i){
        store.month=+e.target.dataset.i;
        applyRecurring();
        save();
      }
    };

    /* Categories */
    function addCategory(){
      const c=$('newCategory').value.trim();
      const sc=$('newSubCategory').value.trim();
      const b=+$('catBudget').value||0;
      if(!c) return;

      const cats=store.data[YEAR].categories;
      if(!cats[c]) cats[c]={budget:0,sub:[]};
      if(sc && !cats[c].sub.includes(sc)) cats[c].sub.push(sc);
      if(b) cats[c].budget=b;

      $('newCategory').value='';$('newSubCategory').value='';$('catBudget').value='';
      save();
    }

    function updateSub(){
      const subs=store.data[YEAR].categories[categoryEl.value]?.sub||[];
      subCategoryEl.innerHTML=subs.map(s=>`<option>${s}</option>`).join('');
    }

    /* Expenses */
    function addExpense(){
      const amt=+$('amount').value;
      if(!amt||!categoryEl.value) return;

      const exp={
        p:$('person').value,
        c:categoryEl.value,
        sc:subCategoryEl.value||'',
        a:amt,
        split:$('person').value==='Family'?{Husband:50,Wife:50}:null
      };

      store.data[YEAR].months[store.month].push(exp);
      if($('recurring').value==='monthly') store.recurring.push({...exp});

      $('amount').value='';$('recurring').value='';
      save();
    }

    function applyRecurring(){
      const m=store.data[YEAR].months[store.month];
      store.recurring.forEach(r=>{
        if(!m.some(e=>e.c===r.c&&e.sc===r.sc&&e.a===r.a)) m.push({...r});
      });
    }

    function delExp(i){
      store.data[YEAR].months[store.month].splice(i,1);
      save();
    }

    /* Render */
    function render(){
      const cats=store.data[YEAR].categories;
      categoryEl.innerHTML=Object.keys(cats).map(c=>`<option>${c}</option>`).join('');
      updateSub();

      const data=store.data[YEAR].months[store.month]
        .filter(e=>store.view==='Family'||e.p!=='Family');

      const total=data.reduce((s,e)=>s+e.a,0);
      $('balance').innerText=`₹${-total}`;
      $('incomeText').innerText=`Expense ₹${total}`;

      $('husbandSummary').innerText=
        `Husband ₹${data.filter(e=>e.p==='Husband').reduce((s,e)=>s+e.a,0)}`;
      $('wifeSummary').innerText=
        `Wife ₹${data.filter(e=>e.p==='Wife').reduce((s,e)=>s+e.a,0)}`;

      $('list').innerHTML=data.map((e,i)=>`
    <li class="list-group-item d-flex justify-content-between">
    ${e.p} · ${e.c}/${e.sc||'-'} ₹${e.a}
    <button class="btn btn-sm btn-danger" onclick="delExp(${i})">X</button>
    </li>`).join('');

      $('catManager').innerHTML=Object.entries(cats).map(([c,v])=>{
        const spent=data.filter(e=>e.c===c).reduce((s,e)=>s+e.a,0);
        const p=v.budget?Math.min(100,(spent/v.budget)*100):0;
        return `<div class="mb-2">
    <b>${c}</b> (₹${v.budget||'-'})
    <div class="progress">
    <div class="progress-bar ${p>80?'bg-warning':'bg-success'}" style="width:${p}%"></div>
    </div></div>`;
      }).join('');

      yearlyChart();
    }

    function yearlyChart(){
      const ctx=$('yearChart');
      if(chart) chart.destroy();
      const sum={};
      Object.values(store.data[YEAR].months).flat().forEach(e=>sum[e.c]=(sum[e.c]||0)+e.a);
      chart=new Chart(ctx,{type:'pie',data:{labels:Object.keys(sum),datasets:[{data:Object.values(sum)}]}});
    }

    function save(){
      localStorage.setItem('tracker_pro_pp',JSON.stringify(store));
      render();
    }

    /* UI */
    $('viewFamily').onclick=()=>{store.view='Family';save();};
    $('viewPersonal').onclick=()=>{store.view='Personal';save();};

    $('addCatBtn').onclick=addCategory;
    $('addExpenseBtn').onclick=addExpense;
    categoryEl.onchange=updateSub;

    applyRecurring();
    render();
</script>
</body>
</html>
