<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker Pro++</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body{background:#f8fafc}
        body.dark{background:#0f172a;color:#e5e7eb}
        .card{border-radius:1rem}
        .small-btn{padding:.25rem .5rem;font-size:.8rem}
        .progress{height:6px}
        .toggle-btn.active{background:#0d6efd;color:#fff}
    </style>
</head>
<body>
<div class="container py-3">

    <div class="card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-1">Monthly Balance</h6>
                    <h2 id="balance">₹0</h2>
                    <small id="incomeText"></small>
                </div>
                <div class="btn-group">
                    <button class="btn btn-outline-primary toggle-btn active" id="viewFamily">Family</button>
                    <button class="btn btn-outline-primary toggle-btn" id="viewPersonal">Personal</button>
                </div>
            </div>
            <div class="mt-2 d-flex gap-3">
                <span class="badge bg-primary" id="husbandSummary">Husband ₹0</span>
                <span class="badge bg-success" id="wifeSummary">Wife ₹0</span>
            </div>
        </div>
    </div>

    <ul class="nav nav-pills mb-3" id="monthTabs"></ul>

    <div class="card mb-3">
        <div class="card-body">
            <h6>Yearly Budget Planning</h6>
            <div class="row g-2" id="yearPlan"></div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body row g-2">
            <div class="col-4"><input id="newCategory" class="form-control" placeholder="Category"></div>
            <div class="col-4"><input id="newSubCategory" class="form-control" placeholder="Sub-category"></div>
            <div class="col-2"><input id="catBudget" type="number" class="form-control" placeholder="Monthly Budget"></div>
            <div class="col-2"><button class="btn btn-primary w-100" id="addCatBtn">Add</button></div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h6>Categories</h6>
            <div id="catManager"></div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body row g-2">
            <div class="col-2">
                <select id="person" class="form-select">
                    <option>Husband</option>
                    <option>Wife</option>
                    <option>Family</option>
                </select>
            </div>
            <div class="col-2"><select id="category" class="form-select"></select></div>
            <div class="col-2"><select id="subCategory" class="form-select"></select></div>
            <div class="col-2"><input id="amount" type="number" class="form-control" placeholder="Amount"></div>
            <div class="col-2">
                <select id="recurring" class="form-select">
                    <option value="">One-time</option>
                    <option value="monthly">Recurring</option>
                </select>
            </div>
            <div class="col-2"><button class="btn btn-success w-100" id="addExpenseBtn">Add</button></div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h6>Yearly Category Summary</h6>
            <canvas id="yearChart"></canvas>
        </div>
    </div>

    <div class="card">
        <ul class="list-group list-group-flush" id="list"></ul>
    </div>
</div>

<script>
    'use strict';

    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const $=id=>document.getElementById(id);

    let store = JSON.parse(localStorage.getItem('tracker_pro_pp')) || {
      month:new Date().getMonth(),
      view:'Family',
      months:{},
      categories:{},
      budgets:{},
      yearlyBudgets:{},
      recurring:[]
    };

    months.forEach((_,i)=>{if(!store.months[i])store.months[i]=[]});

    const monthTabs=$('monthTabs');
    const categoryEl=$('category');
    const subCategoryEl=$('subCategory');
    let yearChartInstance=null;

    monthTabs.innerHTML=months.map((m,i)=>`<li class='nav-item'><button class='nav-link ${i===store.month?'active':''}' data-i='${i}'>${m}</button></li>`).join('');
    monthTabs.addEventListener('click',e=>{
      if(e.target.dataset.i){store.month=+e.target.dataset.i;applyRecurring();save();}
    });

    function addCategory(){
      const c=$('newCategory').value.trim();
      const sc=$('newSubCategory').value.trim();
      const b=+$('catBudget').value||0;
      if(!c) return;
      store.categories[c]=store.categories[c]||[];
      if(sc && !store.categories[c].includes(sc)) store.categories[c].push(sc);
      if(b){store.budgets[c]=b;store.yearlyBudgets[c]=b*12;}
      $('newCategory').value='';$('newSubCategory').value='';$('catBudget').value='';
      save();
    }

    function updateSubCategory(){
      subCategoryEl.innerHTML=(store.categories[categoryEl.value]||[]).map(s=>`<option>${s}</option>`).join('');
    }

    function addExpense(){
      const exp={p:$('person').value,c:categoryEl.value,sc:subCategoryEl.value,a:+$('amount').value};
      if(!exp.c||!exp.a) return;
      store.months[store.month].push(exp);
      if($('recurring').value==='monthly') store.recurring.push({...exp});
      $('amount').value='';$('recurring').value='';
      save();
    }

    function applyRecurring(){
      const m=store.months[store.month];
      store.recurring.forEach(r=>{if(!m.some(e=>e.c===r.c&&e.sc===r.sc&&e.a===r.a))m.push({...r});});
    }

    function delExp(i){store.months[store.month].splice(i,1);save();}

    function render(){
      categoryEl.innerHTML=Object.keys(store.categories).map(c=>`<option>${c}</option>`).join('');
      updateSubCategory();

      const data=store.months[store.month].filter(e=>store.view==='Family'||e.p!=='Family');
      const total=data.reduce((s,e)=>s+e.a,0);

      $('balance').innerText=`₹${-total}`;
      $('incomeText').innerText=`Expense ₹${total}`;
      $('husbandSummary').innerText=`Husband ₹${data.filter(e=>e.p==='Husband').reduce((s,e)=>s+e.a,0)}`;
      $('wifeSummary').innerText=`Wife ₹${data.filter(e=>e.p==='Wife').reduce((s,e)=>s+e.a,0)}`;

      $('list').innerHTML=data.map((e,i)=>`<li class='list-group-item d-flex justify-content-between'>${e.p} · ${e.c}/${e.sc||'-'} ₹${e.a}<button class='btn btn-sm btn-danger' onclick='delExp(${i})'>X</button></li>`).join('');

      $('catManager').innerHTML=Object.keys(store.categories).map(c=>{
        const spent=data.filter(e=>e.c===c).reduce((s,e)=>s+e.a,0);
        const b=store.budgets[c]||0;const p=b?Math.min(100,(spent/b)*100):0;
        return `<div class='mb-2'><b>${c}</b> (₹${b||'-'})<div class='progress'><div class='progress-bar ${p>80?'bg-warning':'bg-success'}' style='width:${p}%'></div></div></div>`;
      }).join('');

      $('yearPlan').innerHTML=Object.entries(store.yearlyBudgets).map(([c,v])=>`<div class='col-4'>${c}: ₹${v}</div>`).join('');

      yearlyChart();
    }

    function yearlyChart(){
      const ctx=$('yearChart').getContext('2d');
      if(yearChartInstance) yearChartInstance.destroy();
      const sum={};Object.values(store.months).flat().forEach(e=>sum[e.c]=(sum[e.c]||0)+e.a);
      yearChartInstance=new Chart(ctx,{type:'pie',data:{labels:Object.keys(sum),datasets:[{data:Object.values(sum)}]}});
    }

    function save(){localStorage.setItem('tracker_pro_pp',JSON.stringify(store));render();}

    $('viewFamily').onclick=()=>{store.view='Family';$('viewFamily').classList.add('active');$('viewPersonal').classList.remove('active');save();};
    $('viewPersonal').onclick=()=>{store.view='Personal';$('viewPersonal').classList.add('active');$('viewFamily').classList.remove('active');save();};

    $('addCatBtn').onclick=addCategory;
    $('addExpenseBtn').onclick=addExpense;
    categoryEl.onchange=updateSubCategory;

    applyRecurring();render();
</script>
</body>
</html>
